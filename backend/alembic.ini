# NEW FILE -- Alembic configuration. Run all alembic commands from inside
# backend/ (this file's directory), e.g.:
#   cd backend
#   alembic upgrade head
#
# sqlalchemy.url is deliberately left blank here -- migrations/env.py reads
# the real connection string from app.core.config.settings.DATABASE_URL at
# runtime, so the same migration history works against your local SQLite
# file and your production Postgres database without editing this file.

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
